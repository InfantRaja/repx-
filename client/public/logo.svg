      <stop offset="0%" stop-color="#EAFF66" />
      <stop offset="100%" stop-color="#D4FF00" />
    </linearGradient>
    <linearGradient id="repxCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
